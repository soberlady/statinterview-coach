name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/agent/pyproject.toml
      - run: npm ci
      - name: Audit dependencies (including build tools)
        run: npm run audit:dependencies
      - run: npx playwright install --with-deps chromium
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "./services/agent[dev]"
      - run: npm run verify
      - name: Install pinned production voice dependencies
        run: python -m pip install -r services/agent/requirements.txt
      - name: Validate voice worker imports with production extras
        run: python -c "import statinterview_agent.livekit_worker"
      - name: Check installed Python runtime and test dependencies
        run: python -m pip check
      - name: Audit Python dependencies including voice and test tools
        run: npm run audit:python
      - name: Test Python with production voice extras installed
        run: npm run test:agent
      - name: Verify generated evidence is reproducible
        run: git diff --exit-code
