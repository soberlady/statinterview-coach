name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/agent/pyproject.toml
      - run: npm ci
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "./services/agent[voice,dev]"
      - run: npm run verify
      - name: Validate voice worker imports with production extras
        run: python -c "import statinterview_agent.livekit_worker"
      - name: Verify generated evidence is reproducible
        run: git diff --exit-code
